<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/error.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error Infotech | Portal</title>
    <script>
      (function() {
        // Clear any old stored dark mode so light mode is active
        if (!sessionStorage.getItem('theme_default_set')) {
          localStorage.setItem('theme', 'light');
          localStorage.setItem('darkMode', 'false');
          sessionStorage.setItem('theme_default_set', '1');
        }
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
